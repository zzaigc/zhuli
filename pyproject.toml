[project]
name = "zhuli"
version = "0.2.0"
description = "本地 AI 助理：浏览器自动化 + 视频剪辑 + 命令执行 + 外部工具对接（模块化）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "playwright>=1.44",
    "openai>=1.30",
    "keyring>=24.3",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
zhuli = "zhuli.main:main"
zhuli-mcp = "zhuli.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
